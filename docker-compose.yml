version: '3.8'

services:
  db:
    image: postgres:17
    container_name: beveragetrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beveragetrack
      POSTGRES_USER: beverage_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-beverage_secret_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beverage_user -d beveragetrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beveragetrack-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://beverage_user:beverage_secret_password_2026@db:5432/beveragetrack
      - SECRET_KEY=beveragetrack-super-secret-production-key-freetown-2026
      - PROJECT_NAME=BeverageTrack AI
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beveragetrack-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
